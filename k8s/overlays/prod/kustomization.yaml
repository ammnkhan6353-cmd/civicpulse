# Production overlay. CD pins BOTH images to the commit SHA with
#   kustomize edit set image civicpulse-backend=ghcr.io/<owner>/civicpulse-backend:<sha>
# so "what is production running?" has a one-word answer you can paste into `git show`.
# The tags committed below are placeholders and are never deployed as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: civicpulse-backend
    newName: ghcr.io/OWNER/civicpulse-backend
    newTag: set-by-cd
  - name: civicpulse-frontend
    newName: ghcr.io/OWNER/civicpulse-frontend
    newTag: set-by-cd

# Real secrets: CD writes secrets.prod.env from GitHub Secrets (the file is
# gitignored) and this generator REPLACES the placeholder Secret from base.
secretGenerator:
  - name: civicpulse-secrets
    behavior: replace
    envs:
      - secrets.prod.env

generatorOptions:
  disableNameSuffixHash: true
