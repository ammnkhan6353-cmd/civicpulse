# Recommender mode ONLY (updateMode: "Off"). VPA in Auto would fight the HPA:
# both act on CPU - VPA raises the request, utilisation (usage/request) drops, the
# HPA scales in, per-pod load rises, VPA raises the request again...
# A human reads the recommendation and edits backend.yaml instead.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-vpa
  namespace: civicpulse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources: ["cpu", "memory"]
