name: ci

# Runs on every PR to main or dev, and on every push to dev.
# Also callable (workflow_call) so cd.yml and release.yml re-run the full suite
# on the merged result before anything is published.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_call:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend tooling
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        working-directory: backend
        run: ruff check .
      - name: mypy (types)
        working-directory: backend
        run: mypy app
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck
      - name: Typed API client matches the backend OpenAPI schema
        run: |
          (cd backend && python -m app.export_openapi openapi.json)
          (cd frontend && npm run gen:api)
          git diff --exit-code frontend/src/api/schema.d.ts || {
            echo "::error::frontend/src/api/schema.d.ts is out of date. Run the 'Regenerate the typed client' step in the README and commit it."
            exit 1
          }

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated   # deterministic: no network, same answer every run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest with coverage >= 65% on app/
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: vitest component tests
        working-directory: frontend
        run: npm test

  build:
    # Builds both images. Does NOT push: a PR must never publish artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci backend
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci frontend
      - name: Report image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep civicpulse
      - name: Save images for the scan job
        run: docker save civicpulse-backend:ci civicpulse-frontend:ci -o images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: docker load -i images.tar
      - name: Install Trivy (official apt repository)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q
          sudo apt-get install -y -q trivy
          trivy --version
      - name: Trivy - fail on HIGH/CRITICAL that have a fixed version
        run: |
          for image in civicpulse-backend:ci civicpulse-frontend:ci; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "$image"
          done

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform || \
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: kustomize build overlays/prod | kubeconform
        run: |
          # The real secrets file is gitignored; validate the structure with the template.
          cp k8s/overlays/prod/secrets.prod.env.example k8s/overlays/prod/secrets.prod.env
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          # VPA is a CRD with no built-in schema, hence -ignore-missing-schemas.
          kubeconform -strict -ignore-missing-schemas -summary rendered.yaml
          kubectl kustomize k8s/overlays/dev | kubeconform -strict -ignore-missing-schemas -summary

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure .env for CI (simulated triage, no secrets needed)
        run: |
          cp .env.example .env
          sed -i 's/^TRIAGE_PROVIDER=.*/TRIAGE_PROVIDER=simulated/' .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
      - name: docker compose up -d
        run: docker compose up -d --build
      - name: Wait for backend /ready and frontend (nginx) to be up
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready && curl -fsS http://127.0.0.1:8080/healthz; then
              echo "backend and frontend are up"; exit 0
            fi
            sleep 3
          done
          docker compose ps
          echo "::error::stack never became ready"; exit 1
      - name: POST a complaint through nginx, GET it back, assert the category
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080
          created=$(curl -fsS -X POST "$BASE/api/complaints" -H 'Content-Type: application/json' \
            -d '{"text":"Burst water main flooding Street 12 since fajr, water entering houses","location":"Street 12, G-9/2, Islamabad"}')
          echo "$created"
          id=$(echo "$created" | jq -r .id)
          fetched=$(curl -fsS "$BASE/api/complaints/$id")
          echo "$fetched"
          test "$(echo "$fetched" | jq -r .category)" = "water"
          test "$(echo "$fetched" | jq -r .triaged_by)" = "simulated"
      - name: X-Cache goes MISS -> HIT on /api/stats
        run: |
          set -euo pipefail
          first=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/stats | grep -i '^x-cache:' | tr -d '\r' | awk '{print $2}')
          second=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/stats | grep -i '^x-cache:' | tr -d '\r' | awk '{print $2}')
          echo "first=$first second=$second"
          test "$first" = "MISS"
          test "$second" = "HIT"
      - name: Frontend cannot reach the database (network segmentation)
        run: |
          if docker compose exec -T frontend ping -c1 -W2 postgres; then
            echo "::error::frontend can reach postgres - segmentation broken"; exit 1
          fi
          echo "OK: frontend has no route to postgres"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: docker compose down -v
        if: always()
        run: docker compose down -v
