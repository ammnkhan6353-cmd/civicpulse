# CivicPulse - development stack.   cp .env.example .env && docker compose up -d
#
# Two networks (network segmentation is the point):
#   edge     - frontend <-> backend. Normal bridge, has outbound internet.
#   internal - backend <-> postgres <-> redis (<-> ollama). internal: true = no
#              route to the outside world at all.
# The backend is the ONLY service on both, so the internet-facing frontend has no
# route to the data:   docker compose exec frontend ping -c1 postgres   -> fails.
# The backend reaches Groq through the edge network (see ENGINEERING-NOTES Q7).

name: civicpulse

services:
  frontend:
    build:
      context: ./frontend
    image: civicpulse-frontend:dev
    ports:
      - "8080:8080"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  backend:
    build:
      context: ./backend
    image: civicpulse-backend:dev
    # Dev only: hot reload from the bind-mounted source below.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/app", "--no-access-log"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-llm}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      SIMULATED_FAILURE_MODE: ${SIMULATED_FAILURE_MODE:-none}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Bind mount for development ONLY: edit code on the laptop, uvicorn reloads.
      # Deliberately absent from compose.prod.yaml - production must run exactly
      # the code that was built into (and scanned in) the image.
      - ./backend/app:/app/app:ro
    ports:
      - "8000:8000"   # dev convenience: http://127.0.0.1:8000/docs
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # One-shot: apply Alembic migrations, then load the idempotent seed.
  migrate:
    image: civicpulse-backend:dev
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true   # one-shot job: its health is its exit code
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # dev only (loopback) - never published in compose.prod.yaml
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Fully offline triage path. Start with:  docker compose --profile offline up -d
  # and set TRIAGE_PROVIDER=ollama in .env. Pull the model once (see README).
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["offline"]
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:         # PostgreSQL data directory - the durable one; losing it loses complaints
  redisdata:      # Redis AOF - keeps rate-limit windows, triage cache + hit-rate counters across restarts
  ollama_models:  # model weights (~1.3 GB) so they are not re-pulled on every `up`
