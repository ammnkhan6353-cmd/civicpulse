# Served by nginx-unprivileged (non-root, listens on 8080).
#
# Runtime configuration (ADR 0002): the React bundle only calls relative /api/...
# URLs, and nginx proxies them to the backend. The SAME image therefore runs in
# Compose, CI and Kubernetes - no backend URL is ever baked in at build time.
# (On Kubernetes the Ingress routes /api straight to the backend Service; this
# proxy block is then simply not used.)

# Propagate the browser's X-Request-ID, or mint one, so a single id follows the
# request from nginx into every backend log line.
map $http_x_request_id $civic_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $civic_request_id;
        # AI triage can take seconds; stay above the backend's 10 s triage timeout.
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
